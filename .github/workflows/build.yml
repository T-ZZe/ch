name: Build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Compiler Poses
        run: mvn -B package -f "$(find . -name pom.xml -not -path '*/target/*' | head -n 1)"
      - uses: actions/upload-artifact@v4
        with:
          name: Poses
          path: '**/target/Poses-1.0.jar'
